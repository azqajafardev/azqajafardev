<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI workflow: user query flows through intent analysis, retrieval and a reasoning agent to a verified, cited response">
  <title>How the AI pipeline processes a query</title>
  <defs>
    <linearGradient id="boxFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1120"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4370"/>
    </marker>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
    .box { animation: activate 10s ease-in-out infinite; }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: 1.6s; }
    .b3 { animation-delay: 3.2s; }
    .b4 { animation-delay: 4.8s; }
    .b5 { animation-delay: 6.4s; }
    @keyframes activate {
      0%, 100% { stroke: #2c3554; }
      6% { stroke: #22d3ee; }
      16% { stroke: #2c3554; }
    }
    .flow { opacity: 0.85; }
    @media (prefers-reduced-motion: reduce) {
      .flow { opacity: 0; }
    }
  </style>

  <!-- connectors -->
  <g stroke="#2c3554" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="220" y1="120" x2="288" y2="120"/>
    <line x1="452" y1="120" x2="520" y2="120"/>
    <line x1="684" y1="120" x2="752" y2="120"/>
    <line x1="916" y1="120" x2="984" y2="120"/>
  </g>

  <!-- flow particles between stages -->
  <circle class="flow" r="3" fill="#67e8f9"><animateMotion dur="1.7s" begin="0s" repeatCount="indefinite" path="M220,120 L288,120"/></circle>
  <circle class="flow" r="3" fill="#a78bfa"><animateMotion dur="1.7s" begin="0.4s" repeatCount="indefinite" path="M452,120 L520,120"/></circle>
  <circle class="flow" r="3" fill="#22d3ee"><animateMotion dur="1.7s" begin="0.8s" repeatCount="indefinite" path="M684,120 L752,120"/></circle>
  <circle class="flow" r="3" fill="#f472b6"><animateMotion dur="1.7s" begin="1.2s" repeatCount="indefinite" path="M916,120 L984,120"/></circle>

  <!-- stage 1: user query -->
  <g font-family="Segoe UI, -apple-system, sans-serif">
    <rect class="box b1" x="40" y="70" width="180" height="100" rx="10" fill="url(#boxFill)" stroke="#2c3554" stroke-width="1.4"/>
    <path d="M100,105 h60 a6,6 0 0 1 6,6 v18 a6,6 0 0 1 -6,6 h-42 l-14,12 v-12 h-4 a6,6 0 0 1 -6,-6 v-18 a6,6 0 0 1 6,-6 z" fill="none" stroke="#67e8f9" stroke-width="1.6"/>
    <text x="130" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e6e9f5">User Query</text>
    <text x="130" y="167" text-anchor="middle" font-size="10.5" fill="#6b7398">Question in</text>
  </g>

  <!-- stage 2: intent analysis -->
  <g font-family="Segoe UI, -apple-system, sans-serif">
    <rect class="box b2" x="272" y="70" width="180" height="100" rx="10" fill="url(#boxFill)" stroke="#2c3554" stroke-width="1.4"/>
    <circle cx="352" cy="115" r="12" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
    <line x1="361" y1="124" x2="372" y2="135" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round"/>
    <text x="362" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e6e9f5">Intent Analysis</text>
    <text x="362" y="167" text-anchor="middle" font-size="10.5" fill="#6b7398">What is being asked</text>
  </g>

  <!-- stage 3: retrieval -->
  <g font-family="Segoe UI, -apple-system, sans-serif">
    <rect class="box b3" x="504" y="70" width="180" height="100" rx="10" fill="url(#boxFill)" stroke="#2c3554" stroke-width="1.4"/>
    <ellipse cx="594" cy="106" rx="16" ry="6" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
    <path d="M578,106 v18 a16,6 0 0 0 32,0 v-18" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="594" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e6e9f5">Retrieval</text>
    <text x="594" y="167" text-anchor="middle" font-size="10.5" fill="#6b7398">Vector search over sources</text>
  </g>

  <!-- stage 4: reasoning agent -->
  <g font-family="Segoe UI, -apple-system, sans-serif">
    <rect class="box b4" x="736" y="70" width="180" height="100" rx="10" fill="url(#boxFill)" stroke="#2c3554" stroke-width="1.4"/>
    <g stroke="#f472b6" stroke-width="1.3" fill="#f472b6">
      <circle cx="806" cy="106" r="2.4"/>
      <circle cx="826" cy="98" r="2.4"/>
      <circle cx="826" cy="118" r="2.4"/>
      <circle cx="816" cy="112" r="2.6" fill="none" stroke="#f472b6"/>
      <line x1="806" y1="106" x2="816" y2="112" stroke-opacity="0.7"/>
      <line x1="826" y1="98" x2="816" y2="112" stroke-opacity="0.7"/>
      <line x1="826" y1="118" x2="816" y2="112" stroke-opacity="0.7"/>
    </g>
    <text x="826" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e6e9f5">Reasoning Agent</text>
    <text x="826" y="167" text-anchor="middle" font-size="10.5" fill="#6b7398">Weighs evidence, plans steps</text>
  </g>

  <!-- stage 5: verified response -->
  <g font-family="Segoe UI, -apple-system, sans-serif">
    <rect class="box b5" x="968" y="70" width="192" height="100" rx="10" fill="url(#boxFill)" stroke="#2c3554" stroke-width="1.4"/>
    <circle cx="1050" cy="112" r="13" fill="none" stroke="#34d399" stroke-width="1.6"/>
    <path d="M1044,112 l4,4 l8,-9" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1064" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e6e9f5">Verified Response</text>
    <text x="1064" y="167" text-anchor="middle" font-size="10.5" fill="#6b7398">Answer with citations</text>
  </g>
</svg>
