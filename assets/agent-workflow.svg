<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="285" viewBox="0 0 1200 285" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-first AI workflow</title><desc id="desc">Question, understand intent, retrieve evidence, reason with tools, and return a cited answer.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B172B"/><stop offset="1" stop-color="#14233D"/></linearGradient><linearGradient id="line" x2="1"><stop stop-color="#30D5C8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><style>.title{font:600 23px 'Segoe UI',Arial,sans-serif;fill:#EAF3FF}.label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#ECF4FF}.sub{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#AFC1D8}.step{font:700 13px 'Segoe UI',Arial,sans-serif;fill:#6DE4D4}.stream{stroke-dasharray:6 8;animation:move 5s linear infinite}@keyframes move{to{stroke-dashoffset:-70}}@media(prefers-reduced-motion:reduce){.stream{animation:none}}</style></defs>
  <rect x="1" y="1" width="1198" height="283" rx="22" fill="url(#bg)" stroke="#4F6B8B" stroke-opacity=".45" stroke-width="2"/>
  <text x="42" y="47" class="title">Evidence-first AI workflow</text><text x="42" y="73" class="sub">From a question to a response you can inspect.</text>
  <path d="M147 164H1054" stroke="#304866" stroke-width="4"/><path class="stream" d="M147 164H1054" stroke="url(#line)" stroke-width="3"/>
  <g fill="#13283F" stroke="#5B809B" stroke-width="1.6"><rect x="38" y="110" width="194" height="113" rx="16"/><rect x="269" y="110" width="194" height="113" rx="16"/><rect x="500" y="110" width="194" height="113" rx="16"/><rect x="731" y="110" width="194" height="113" rx="16"/><rect x="962" y="110" width="200" height="113" rx="16"/></g>
  <g class="step"><text x="56" y="138">01 / INPUT</text><text x="287" y="138">02 / INTENT</text><text x="518" y="138">03 / EVIDENCE</text><text x="749" y="138">04 / REASONING</text><text x="980" y="138">05 / RESPONSE</text></g>
  <g class="label"><text x="56" y="174">Ask a question</text><text x="287" y="174">Understand</text><text x="518" y="174">Retrieve</text><text x="749" y="174">Use tools</text><text x="980" y="174">Answer + cite</text></g>
  <g class="sub"><text x="56" y="201">Goal and context</text><text x="287" y="201">Scope and constraints</text><text x="518" y="201">Documents and sources</text><text x="749" y="201">Check and synthesize</text><text x="980" y="201">Traceable sources</text></g>
  <g fill="#35D7C7"><circle cx="240" cy="164" r="4"/><circle cx="471" cy="164" r="4"/><circle cx="702" cy="164" r="4"/><circle cx="933" cy="164" r="4"/></g>
  <text x="42" y="256" class="sub">Design principle: if evidence is weak, surface uncertainty instead of inventing certainty.</text>
</svg>
