<svg width="1100" height="260" viewBox="0 0 1100 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="260" fill="#0f172a" rx="14"/>

  <!-- base track -->
  <line x1="80" y1="130" x2="1020" y2="130" stroke="#334155" stroke-width="3"/>
  <!-- animated glow travel -->
  <line x1="80" y1="130" x2="1020" y2="130" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="120 900">
    <animate attributeName="stroke-dashoffset" values="0;-1020" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- Node 1: Graphics Internship -->
  <g transform="translate(160,130)">
    <circle r="9" fill="#0f172a" stroke="#c084fc" stroke-width="3"><animate attributeName="stroke-width" values="2;4;2" dur="2.4s" repeatCount="indefinite"/></circle>
    <text y="-24" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#c084fc" font-weight="600">05/2025 – 08/2025</text>
    <text y="42" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">Graphics Design Intern</text>
    <text y="60" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#94a3b8">Surat Educational Complex</text>
  </g>

  <!-- Node 2: Python Internship -->
  <g transform="translate(440,130)">
    <circle r="9" fill="#0f172a" stroke="#818cf8" stroke-width="3"><animate attributeName="stroke-width" values="2;4;2" dur="2.6s" repeatCount="indefinite"/></circle>
    <text y="-24" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#818cf8" font-weight="600">10/2025 – 12/2025</text>
    <text y="42" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">Python Developer Intern</text>
    <text y="60" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#94a3b8">Efaida Technologies</text>
  </g>

  <!-- Node 3: AI Developer -->
  <g transform="translate(760,130)">
    <circle r="11" fill="#0f172a" stroke="#e879f9" stroke-width="3.5"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite"/></circle>
    <text y="-24" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#e879f9" font-weight="700">May/2026 – Present</text>
    <text y="42" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#f8fafc" font-weight="700">AI Developer</text>
    <text y="60" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#94a3b8">Cyberzeus Software System</text>
  </g>

  <!-- pulsing marker at present -->
  <g transform="translate(760,130)">
    <circle r="18" fill="none" stroke="#e879f9" stroke-width="1.5" opacity="0.7">
      <animate attributeName="r" values="10;24" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="550" y="230" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#64748b">
    Graphics Design → Python Automation → AI &amp; LLM Systems Engineering
  </text>
</svg>
