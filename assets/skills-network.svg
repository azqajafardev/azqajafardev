<svg width="1100" height="340" viewBox="0 0 1100 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1100" height="340" fill="#0f172a" rx="14"/>

  <!-- core node: AI Engineering -->
  <circle cx="550" cy="170" r="46" fill="url(#coreGlow)"/>
  <circle cx="550" cy="170" r="34" fill="#1e1b4b" stroke="#e879f9" stroke-width="2">
    <animate attributeName="r" values="32;36;32" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="550" y="166" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#f8fafc" font-weight="700">AI</text>
  <text x="550" y="180" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#f8fafc" font-weight="700">Engineering</text>

  <!-- satellite skill nodes -->
  <g font-family="Segoe UI, Verdana, sans-serif" font-size="12" font-weight="600">
    <!-- helper macro-like repeated groups -->
    <g>
      <line x1="550" y1="170" x2="230" y2="70" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="0.15;0.55;0.15" dur="3.6s" repeatCount="indefinite"/></line>
      <circle cx="230" cy="70" r="24" fill="#111827" stroke="#818cf8" stroke-width="2"/>
      <text x="230" y="75" text-anchor="middle" fill="#c7d2fe">LLM</text>
    </g>
    <g>
      <line x1="550" y1="170" x2="150" y2="180" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/></line>
      <circle cx="150" cy="180" r="24" fill="#111827" stroke="#c084fc" stroke-width="2"/>
      <text x="150" y="185" text-anchor="middle" fill="#e9d5ff">RAG</text>
    </g>
    <g>
      <line x1="550" y1="170" x2="230" y2="280" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="4.2s" repeatCount="indefinite"/></line>
      <circle cx="230" cy="280" r="28" fill="#111827" stroke="#e879f9" stroke-width="2"/>
      <text x="230" y="285" text-anchor="middle" fill="#fbcfe8">Agents</text>
    </g>
    <g>
      <line x1="550" y1="170" x2="420" y2="60" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="3.4s" repeatCount="indefinite"/></line>
      <circle cx="420" cy="60" r="26" fill="#111827" stroke="#818cf8" stroke-width="2"/>
      <text x="420" y="65" text-anchor="middle" fill="#c7d2fe">LangChain</text>
    </g>
    <g>
      <line x1="550" y1="170" x2="680" y2="60" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="0.15;0.55;0.15" dur="3.8s" repeatCount="indefinite"/></line>
      <circle cx="680" cy="60" r="26" fill="#111827" stroke="#c084fc" stroke-width="2"/>
      <text x="680" y="65" text-anchor="middle" fill="#e9d5ff">LangGraph</text>
    </g>
    <g>
      <line x1="550" y1="170" x2="870" y2="70" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="3.1s" repeatCount="indefinite"/></line>
      <circle cx="870" cy="70" r="24" fill="#111827" stroke="#e879f9" stroke-width="2"/>
      <text x="870" y="75" text-anchor="middle" fill="#fbcfe8">MCP</text>
    </g>
    <g>
      <line x1="550" y1="170" x2="950" y2="180" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="2.9s" repeatCount="indefinite"/></line>
      <circle cx="950" cy="180" r="28" fill="#111827" stroke="#818cf8" stroke-width="2"/>
      <text x="950" y="185" text-anchor="middle" fill="#c7d2fe">Vector DB</text>
    </g>
    <g>
      <line x1="550" y1="170" x2="870" y2="280" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="3.7s" repeatCount="indefinite"/></line>
      <circle cx="870" cy="280" r="26" fill="#111827" stroke="#c084fc" stroke-width="2"/>
      <text x="870" y="285" text-anchor="middle" fill="#e9d5ff">FastAPI</text>
    </g>
    <g>
      <line x1="550" y1="170" x2="680" y2="290" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="0.15;0.55;0.15" dur="3.3s" repeatCount="indefinite"/></line>
      <circle cx="680" cy="290" r="24" fill="#111827" stroke="#e879f9" stroke-width="2"/>
      <text x="680" y="295" text-anchor="middle" fill="#fbcfe8">Flutter</text>
    </g>
    <g>
      <line x1="550" y1="170" x2="420" y2="290" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/></line>
      <circle cx="420" cy="290" r="24" fill="#111827" stroke="#818cf8" stroke-width="2"/>
      <text x="420" y="295" text-anchor="middle" fill="#c7d2fe">PyTorch</text>
    </g>
  </g>

  <!-- drifting particles -->
  <circle cx="60" cy="40" r="2" fill="#e879f9" opacity="0.6"><animate attributeName="cy" values="40;300;40" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="300" r="2" fill="#818cf8" opacity="0.6"><animate attributeName="cy" values="300;40;300" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="30" r="1.6" fill="#c084fc" opacity="0.6"><animate attributeName="cx" values="1000;60;1000" dur="10s" repeatCount="indefinite"/></circle>
</svg>
