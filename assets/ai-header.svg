<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Azqa Jafar — AI Developer</title><desc id="desc">A navy banner with a glowing abstract neural network, animated data paths, and the text Building AI systems that retrieve, reason, and act.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081425"/><stop offset=".57" stop-color="#101B35"/><stop offset="1" stop-color="#152440"/></linearGradient>
    <linearGradient id="stroke" x2="1"><stop stop-color="#30D5C8"/><stop offset="1" stop-color="#A68BFA"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#33D5C5" stop-opacity=".27"/><stop offset="1" stop-color="#33D5C5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#A0B9D5" stroke-opacity=".075"/></pattern>
    <clipPath id="round"><rect width="1200" height="350" rx="25"/></clipPath>
    <style>
      .orbit{transform-origin:968px 175px;animation:turn 36s linear infinite}.pulse{animation:glow 3.8s ease-in-out infinite}.flow{stroke-dasharray:9 12;animation:dash 8s linear infinite}.tiny{font:500 15px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#7BEBDF}.name{font:700 64px 'Segoe UI',Arial,sans-serif;fill:#F3F7FF}.role{font:400 25px 'Segoe UI',Arial,sans-serif;fill:#D9E5F5}.tag{font:500 17px 'Segoe UI',Arial,sans-serif;fill:#A8BAD4}
      @keyframes turn{to{transform:rotate(360deg)}}@keyframes glow{50%{opacity:.45;transform:scale(1.18)}}@keyframes dash{to{stroke-dashoffset:-84}}
      @media(prefers-reduced-motion:reduce){.orbit,.pulse,.flow{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="350" fill="url(#bg)"/><rect width="1200" height="350" fill="url(#grid)"/>
    <circle cx="968" cy="175" r="205" fill="url(#halo)"/>
    <path d="M54 305H680" stroke="url(#stroke)" stroke-opacity=".65" stroke-width="2"/>
    <text x="72" y="76" class="tiny">AZQA JAFAR  /  PORTFOLIO</text>
    <text x="68" y="160" class="name">Azqa Jafar</text>
    <text x="72" y="205" class="role">AI Developer &amp; Software Engineer</text>
    <text x="72" y="256" class="tag">Building systems that retrieve, reason &amp; act.</text>
    <g class="orbit" fill="none" stroke="url(#stroke)" stroke-opacity=".42"><circle cx="968" cy="175" r="130"/><ellipse cx="968" cy="175" rx="181" ry="74" transform="rotate(-28 968 175)"/><ellipse cx="968" cy="175" rx="181" ry="74" transform="rotate(31 968 175)"/></g>
    <g fill="none" stroke="url(#stroke)" stroke-width="2.2" stroke-opacity=".78"><path d="M828 95 926 71 1039 120 1110 201 1008 263 882 235 828 95 882 235 926 71 1008 263 1039 120 882 235"/><path class="flow" d="M791 173 882 235 1008 263 1110 201"/></g>
    <g fill="#A78BFA"><circle cx="828" cy="95" r="6"/><circle cx="1039" cy="120" r="6"/><circle cx="1008" cy="263" r="6"/></g><g fill="#2DD4BF"><circle cx="926" cy="71" r="7"/><circle cx="1110" cy="201" r="7"/><circle cx="882" cy="235" r="7"/></g>
    <circle class="pulse" cx="968" cy="175" r="19" fill="#30D5C8" opacity=".18"/><circle cx="968" cy="175" r="8" fill="#E2FFFC"/>
    <rect x="1" y="1" width="1198" height="348" rx="24" fill="none" stroke="#6384A8" stroke-opacity=".36" stroke-width="2"/>
  </g>
</svg>
