      values="
      M0,100 C180,70 320,130 550,100 C780,70 920,130 1100,100 L1100,140 L0,140 Z;
      M0,110 C180,135 320,75 550,110 C780,145 920,80 1100,110 L1100,140 L0,140 Z;
      M0,100 C180,70 320,130 550,100 C780,70 920,130 1100,100 L1100,140 L0,140 Z"/>
  </path>

  <text x="550" y="45" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600">
