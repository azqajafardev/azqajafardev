<svg width="1100" height="300" viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="1100" height="300" fill="url(#bgGrad)"/>

  <!-- animated neural mesh -->
  <g stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1">
    <line x1="60" y1="60" x2="220" y2="120"><animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/></line>
    <line x1="220" y1="120" x2="120" y2="230"><animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/></line>
    <line x1="120" y1="230" x2="40" y2="150"><animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="220" y1="120" x2="330" y2="70"><animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="850" y1="50" x2="980" y2="110"><animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="4.2s" repeatCount="indefinite"/></line>
    <line x1="980" y1="110" x2="1040" y2="220"><animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="3.8s" repeatCount="indefinite"/></line>
    <line x1="850" y1="50" x2="920" y2="200"><animate attributeName="stroke-opacity" values="0.2;0.55;0.2" dur="5.2s" repeatCount="indefinite"/></line>
    <line x1="920" y1="200" x2="1040" y2="220"><animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="4.6s" repeatCount="indefinite"/></line>
  </g>

  <g filter="url(#softBlur)">
    <circle cx="60" cy="60" r="4" fill="#e879f9"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="120" r="5" fill="#c084fc"><animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="230" r="3.5" fill="#818cf8"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="70" r="4" fill="#e879f9"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="150" r="3" fill="#c084fc"><animate attributeName="r" values="2.5;4.5;2.5" dur="2.6s" repeatCount="indefinite"/></circle>

    <circle cx="850" cy="50" r="4" fill="#818cf8"><animate attributeName="r" values="3;5;3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="110" r="5" fill="#e879f9"><animate attributeName="r" values="4;6;4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="220" r="3.5" fill="#c084fc"><animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="200" r="4" fill="#818cf8"><animate attributeName="r" values="3;5;3" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbiting ring accent -->
  <g transform="translate(1010,60)" opacity="0.8">
    <circle r="26" fill="none" stroke="#e879f9" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#e879f9">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
      <animateMotion path="M26,0 A26,26 0 1,1 25.9,1" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- name + role -->
  <text x="550" y="140" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="46" font-weight="700" fill="url(#textGrad)">
    Azqa Jafar
  </text>
  <text x="550" y="180" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="19" fill="#cbd5e1" letter-spacing="1.5">
    AI &amp; PYTHON DEVELOPER · LLM &amp; RAG ENGINEER
  </text>

  <!-- underline accent -->
  <rect x="440" y="198" width="220" height="3" rx="1.5" fill="url(#textGrad)">
    <animate attributeName="width" values="0;220;220;0" keyTimes="0;0.35;0.75;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="550;440;440;550" keyTimes="0;0.35;0.75;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="550" y="235" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="14" fill="#94a3b8">
    Building intelligent, agentic AI systems — RAG · LangChain · LangGraph · MCP · Flutter
  </text>
</svg>
