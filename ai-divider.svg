<svg width="1200" height="46" viewBox="0 0 1200 46" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decorative divider">
  <defs>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e1c" stop-opacity="0"/>
      <stop offset="12%" stop-color="#2c3554"/>
      <stop offset="88%" stop-color="#2c3554"/>
      <stop offset="100%" stop-color="#0a0e1c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulseDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
    .runner { animation: run 4.5s ease-in-out infinite; }
    @keyframes run {
      0%   { transform: translateX(0); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateX(1080px); opacity: 0; }
    }
  </style>
  <rect x="60" y="22" width="1080" height="1" fill="url(#lineFade)"/>
  <circle cx="60" cy="22" r="2" fill="#22d3ee" opacity="0.6"/>
  <circle cx="1140" cy="22" r="2" fill="#818cf8" opacity="0.6"/>
  <g class="runner">
    <circle cx="60" cy="22" r="9" fill="url(#pulseDot)"/>
    <circle cx="60" cy="22" r="2.4" fill="#e0f2fe"/>
  </g>
</svg>
